name: Firecrawl Scrape / GPT Prediction

on:
  workflow_dispatch:
    inputs:
      date:
        description: "比赛日期 YYYY-MM-DD"
        required: true
        default: "2026-09-02"
      urls:
        description: "可选：空格分隔 URL；留空使用自动发现"
        required: false
        default: ""
      scrape_only:
        description: "仅抓取，不调用 OpenAI"
        required: true
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "run_pipeline.py"
      - "urls.txt"
      - ".github/workflows/predict.yml"

permissions:
  contents: write

concurrency:
  group: firecrawl-scrape-main
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scrape, discovery and source validation
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-sol' }}
        run: |
          DATE="${{ github.event.inputs.date || '2026-09-02' }}"
          URLS="${{ github.event.inputs.urls || '' }}"
          SCRAPE_ONLY="${{ github.event.inputs.scrape_only || 'true' }}"
          EXTRA=""
          if [ "$SCRAPE_ONLY" = "true" ]; then EXTRA="--scrape-only"; fi
          if [ -n "$URLS" ]; then
            python run_pipeline.py --date "$DATE" $EXTRA --urls $URLS
          else
            python run_pipeline.py --date "$DATE" $EXTRA
          fi

      - name: Commit results
        run: |
          DATE="${{ github.event.inputs.date || '2026-09-02' }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add scrape validation results for $DATE"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push conflicted; rebasing onto latest main (attempt $attempt)"
              git pull --rebase origin main
            done
            git push
          fi
