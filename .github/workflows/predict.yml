name: Firecrawl Data Collection

on:
  workflow_dispatch:
    inputs:
      date:
        description: "比赛日期 YYYY-MM-DD"
        required: true
        default: "2026-09-02"
      urls:
        description: "可选：空格分隔 URL；留空使用自动发现"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "run_pipeline.py"
      - "build_match_packages.py"
      - "urls.txt"
      - ".github/workflows/predict.yml"

permissions:
  contents: write

concurrency:
  group: firecrawl-scrape-main
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scrape, discovery and source validation
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          DATE="${{ github.event.inputs.date || '2026-09-02' }}"
          URLS="${{ github.event.inputs.urls || '' }}"
          if [ -n "$URLS" ]; then
            python run_pipeline.py --date "$DATE" --urls $URLS
          else
            python run_pipeline.py --date "$DATE"
          fi

      - name: Build per-match GPT packages
        run: |
          DATE="${{ github.event.inputs.date || '2026-09-02' }}"
          python build_match_packages.py --date "$DATE"

      - name: Verify match packages
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          date=os.environ['DATE_VALUE']
          latest=Path('data/matches')/date/'latest.json'
          obj=json.loads(latest.read_text(encoding='utf-8'))
          idx=json.loads(Path(obj['index']).read_text(encoding='utf-8'))
          print(json.dumps(idx, ensure_ascii=False, indent=2))
          if idx['match_count'] != idx['complete_matches']:
              raise SystemExit(f"Incomplete match packages: {idx['complete_matches']}/{idx['match_count']}")
          PY
        env:
          DATE_VALUE: ${{ github.event.inputs.date || '2026-09-02' }}

      - name: Commit results
        run: |
          DATE="${{ github.event.inputs.date || '2026-09-02' }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add scrape validation and match packages for $DATE"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push conflicted; rebasing onto latest main (attempt $attempt)"
              git pull --rebase origin main
            done
            git push
          fi
